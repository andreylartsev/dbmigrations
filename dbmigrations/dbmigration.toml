
# you can specify the git command line here otherwise it will be resolved via PATH environment variable
#git_cmd_path = "C:/Program Files/Git/cmd/git.exe"


# default database environment name
default_dbenv = "local_windows"

# database environment parameter groups are useful for interactive use during development

[dbenvs.local_windows]
# DB connection options:
# Full list of options could be found at the following URLs:
# - https://www.psycopg.org/psycopg3/docs/api/connections.html
# - https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING
#
host = "localhost"
port = 5432
dbname = "test1"
user = "postgres"
connect_timeout = 10
# sslmode = "prefer"

# extra options not compatible to Postgres but useful
run_tests_by = "postgres"  
no_password = true


# sample database environment for MacBook with postgres server running from command line
# i.e. $ postgres -D ~/postgres_data
[dbenvs.local_macbook]
host = "localhost"
port = 5432
dbname = "esbdb7"
connect_timeout = 10
no_password = true

# extra options
[options]
# the masks to search files with scripts directories (if no "script_list.txt" file specified within scripts subdirectory)
file_glob_filters = ["*.sql", "*.dump"]
# scripts read encoding
file_read_encoding = "utf-8-sig"
# what to do if unknown unicode symbol appears
# possible options: "ignore", "replace"
file_read_encoding_errors = "ignore"

# external tools to apply baseline dumps, used if the name of tool specified by "use_tool.txt" file within baseline subdirectory  
[tools.psql]
# Linux
#executable = "/usr/bin/psql"

# MacBook
#executable = "/opt/homebrew/bin/psql"
#args = ["-f", "${file}", "${dbname}"]

# Windows
executable = "C:/Users/andrey.larcev/NoInstaller/postgresql-18.3-2-windows-x64-binaries/pgsql/bin/psql.exe"
args = ["-h", "${host}", "-p", "${port}", "-U", "${user}", "--set=ON_ERROR_STOP=1", "-d", "${dbname}", "-f", "${file}"]
success_result_code = 0

[tools.pg_restore]
# Linux 
#executable = "/usr/bin/pg_restore"
#args = ["--exit-on-error", "-d", "${dbname}", "${file}"]

# Windows
executable = "/opt/homebrew/bin/pg_restore"
args = ["-h", "${host}", "-U", "${user}", "--exit-on-error", "-p", "${port}", "-d", "${dbname}", "${file}"]
success_result_code = 0
